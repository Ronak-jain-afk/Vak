model:
  vocab_size: 8192
  d_model: 512
  n_layers: 18
  n_heads: 8
  n_kv_heads: 2
  ffn_hidden_dim: 1408
  max_seq_len: 1024
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  init_std: 0.02
  tie_embeddings: true

training:
  micro_batch_size: 8
  seq_len: 1024
  target_batch_tokens: 524288
  max_steps: 1908
  grad_accum_steps: 64
  learning_rate_muon: 0.02
  learning_rate_adamw: 0.002
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 100
  decay_schedule: "cosine"
  min_lr_ratio: 0.1
  resume_rewarm_steps: 100
  precision: "bf16"
  compile: true
  checkpoint_interval_steps: 100
  eval_interval_steps: 50
  save_checkpoint_mins: 15

sft:
  micro_batch_size: 8
  seq_len: 1024
  learning_rate: 0.0002
  weight_decay: 0.01
  epochs: 3

inference:
  max_new_tokens: 256
  max_prompt_len: 768

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  tokenized_dir: "data/tokenized"
  checkpoint_dir: "checkpoints/run_55m"
  tokenizer_dir: "tokenizer"
  log_dir: "logs"
