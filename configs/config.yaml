model:
  vocab_size: 8192
  d_model: 384
  n_layers: 16
  n_heads: 6
  n_kv_heads: 2
  ffn_hidden_dim: 1024
  max_seq_len: 1024
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  init_std: 0.02
  tie_embeddings: true

training:
  micro_batch_size: 8
  seq_len: 1024
  target_batch_tokens: 524288
  grad_accum_steps: 64
  learning_rate_muon: 0.02
  learning_rate_adamw: 0.002
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 500
  decay_schedule: "cosine"
  min_lr_ratio: 0.1
  precision: "bf16"
  compile: true
  checkpoint_interval_steps: 500
  eval_interval_steps: 250
  save_checkpoint_mins: 30

sft:
  micro_batch_size: 8
  seq_len: 1024
  learning_rate: 0.0002
  weight_decay: 0.01
  epochs: 3
  max_input_len: 768
  max_new_tokens: 256

inference:
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.1
  max_new_tokens: 256
  max_prompt_len: 768

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  tokenized_dir: "data/tokenized"
  checkpoint_dir: "checkpoints"
  tokenizer_dir: "tokenizer"
  log_dir: "logs"
